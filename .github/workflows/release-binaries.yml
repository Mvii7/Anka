name: release-binaries

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows-x86_64 binary
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt on Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK on Windows
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        shell: pwsh
        run: glslangValidator --version

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # Compiled files are cached across runs, so a push that changes a few files rebuilds only
      # those. The first run, and one after a compiler or flag change, is a full build.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure Windows
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: cmake --build build/release --target yuzu yuzu-cmd --parallel

      - name: sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Package Windows binary
        shell: pwsh
        run: |
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe

      # The artifact is the bin folder itself: GitHub zips artifacts on download, and uploading a
      # zip gave a zip inside a zip. The release job zips it once for the release.
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-windows-x86_64-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

